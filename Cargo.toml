[workspace]
resolver = "3"
members = [
    "crates/shardpack-cli",
    "crates/shardpack-cache",
    "crates/shardpack-catalog",
    "crates/shardpack-codec",
    "crates/shardpack-config",
    "crates/shardpack-core",
    "crates/shardpack-format",
    "crates/shardpack-gc",
    "crates/shardpack-manifest",
    "crates/shardpack-python",
    "crates/shardpack-runtime",
    "crates/shardpack-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/shardpack/shardpack"
license = "Apache-2.0"

[workspace.dependencies]
aes-gcm = "0.11"
aws-lc-rs = "1.18"
async-trait = "0.1"
async-stream = "0.3"
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
crc32c-fast = "0.1"
crc32c = "0.6.8"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
opendal = { version = "=0.58.2", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "services-fs", "services-s3"] }
prost = "0.14"
prost-types = "0.14"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
zeroize = "1.8"
zrip = { version = "0.8.8", default-features = false, features = ["std", "frame", "simd"] }
zstd = "0.13"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
