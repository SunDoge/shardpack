[tools]
protoc = "latest"
zig = "0.15.2"
"aqua:rust-cross/cargo-zigbuild" = "0.23.2"

[tasks."test:glibc"]
description = "Build the Linux CLI for glibc 2.17 and verify its symbol floor"
run = "./scripts/check-glibc.sh"

[tasks."test:runtime-features"]
description = "Compile every supported shardpack-runtime feature profile"
run = [
  "cargo clippy -p shardpack-runtime --no-default-features -- -D warnings",
  "cargo check -p shardpack-runtime --no-default-features --features pipeline",
  "cargo check -p shardpack-runtime --no-default-features --features job-pin",
  "cargo check -p shardpack-runtime --all-features",
]

[tasks."test:python"]
description = "Build the editable Python extension and run native SDK checks"
dir = "{{config_root}}/python"
run = [
  "uv sync --locked",
  "uv run maturin develop",
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run pytest -q",
]

[tasks."build:python"]
description = "Build the abi3 manylinux 2.17 Python wheel with Zig"
dir = "{{config_root}}/python"
run = "uv run maturin build --release --zig --compatibility manylinux_2_17 --out dist"

[tasks."test:python-torch"]
description = "Run real multi-process PyTorch and Fory end-to-end tests"
depends = ["build:python"]
run = "./scripts/test-python-torch.sh"

[tasks."bench:python-fory"]
description = "Benchmark Fory, ShardPack, and a real PyTorch DataLoader"
depends = ["build:python"]
run = "SHARDPACK_RUN_FORY_BENCH=1 ./scripts/test-python-torch.sh"
