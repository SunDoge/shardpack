[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "shardpack"
version = "0.1.0"
description = "S3-first streaming format, writer, cache, and training loader for ML datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
keywords = ["machine-learning", "object-storage", "s3", "streaming", "training-data"]

[project.urls]
Documentation = "https://github.com/SunDoge/shardpack/tree/main/docs"
Issues = "https://github.com/SunDoge/shardpack/issues"
Repository = "https://github.com/SunDoge/shardpack"

[project.scripts]
shardpack = "shardpack.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "maturin>=1.9,<2",
  "numpy>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]
torch = [
  "albumentations>=2,<3",
  "opencv-python-headless>=4.10,<5.1",
  "pyfory>=1.7,<2",
  "torch>=2.8",
]
yolo = [
  "ultralytics==8.4.159",
]

[tool.maturin]
manifest-path = "../crates/shardpack-python/Cargo.toml"
module-name = "shardpack._native"
python-source = "src"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py311"
