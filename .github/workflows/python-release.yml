name: Publish Python package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build Linux x86-64 wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' python/pyproject.toml | head -n1)
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Build abi3 manylinux wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          maturin-version: v1.15.0
          target: x86_64
          manylinux: "2_17"
          working-directory: python
          args: --release --locked --compatibility pypi --out dist

      - uses: actions/upload-artifact@v5
        with:
          name: python-wheel
          path: python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: sdist
          maturin-version: v1.15.0
          container: "off"
          working-directory: python
          args: --out dist

      - uses: actions/upload-artifact@v5
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify distributions
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check package metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check --strict dist/*

      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -c 'import shardpack; assert shardpack.__version__'
          python -m shardpack --version
          shardpack --version

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/shardpack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish distributions with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
