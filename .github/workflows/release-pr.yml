name: Prepare release PR

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (blank = automatic patch)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - uses: jdx/mise-action@v3
        with:
          install_args: "cargo:release-plz"

      - name: Preserve the pending release version
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head release-plz-product --base main --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -n "$sha" ]; then
            git fetch origin "$sha"
            version=$(git show "$sha:Cargo.toml" | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare shared version, lockfiles, and changelog
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PENDING_VERSION: ${{ steps.pending.outputs.version }}
        run: python scripts/prepare-release.py "$RELEASE_VERSION" --pending-version "$PENDING_VERSION"

      - name: Create or update the release PR
        if: steps.prepare.outputs.prepare == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release-plz-product
          base: main
          commit-message: "chore: release v${{ steps.prepare.outputs.version }}"
          title: "chore: release v${{ steps.prepare.outputs.version }}"
          body: |
            Prepared with release-plz. Rust, Python, and .NET share the Cargo workspace version.

            Review CHANGELOG.md and CI before merging. Merging creates a GitHub
            release; start the PyPI and NuGet workflows manually for its version tag.
            No crates.io packages are published.
          add-paths: |
            Cargo.toml
            Cargo.lock
            crates/**/Cargo.toml
            python/uv.lock
            CHANGELOG.md
