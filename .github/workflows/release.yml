name: Release product

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-product
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v3
        with:
          install_args: "cargo:release-plz"

      - name: Tag and create GitHub release (no crates.io publish)
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz release
