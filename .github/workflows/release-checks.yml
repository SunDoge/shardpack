name: Release checks

on:
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-plz.toml"
      - "mise.toml"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "scripts/*release*"
      - ".github/workflows/*release*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: "cargo:release-plz"
      - run: python -m unittest discover -s scripts -p test_release.py -v
      - run: python scripts/check-release.py
      - run: uv lock --project python --check
